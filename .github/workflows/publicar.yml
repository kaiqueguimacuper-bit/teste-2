name: Publicar Sakuga (site + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-sakuga
  cancel-in-progress: false

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conferir o Android SDK do runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -20
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Compilar APK assinado
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../sakuga.apk
          ls -la ../sakuga.apk

      - name: Guardar o registro da compilação (para diagnóstico)
        if: always()
        run: |
          [ -f build.log ] || echo "sem build.log (falhou antes da compilação)" > build.log
          mkdir -p /tmp/log && cp build.log /tmp/log/ && cd /tmp/log
          git init -q -b build-log && git config user.name "Sakuga Bot" && git config user.email "sakuga-bot@users.noreply.github.com"
          git add -A && git commit -q -m "build ${{ github.run_number }}: ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log

      - uses: actions/upload-artifact@v4
        with:
          name: sakuga-apk
          path: sakuga.apk

      - name: Atualizar a versão "apk-latest" (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Sakuga para Android" --notes "APK mais recente do Sakuga. Baixe sakuga.apk e instale no celular."
          gh release upload apk-latest sakuga.apk --clobber
          gh release edit apk-latest --notes "APK mais recente do Sakuga (build ${{ github.run_number }}, $(date -u +%d/%m/%Y\ %H:%M) UTC). Baixe sakuga.apk e instale no celular."

  site:
    name: Publicar site (GitHub Pages)
    needs: apk
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o APK desta execução
        if: needs.apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sakuga-apk
          path: apk

      - name: Usar o último APK publicado se a compilação falhou
        if: needs.apk.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh release download apk-latest -p sakuga.apk -D apk || echo "ainda não há APK publicado"

      - name: Montar e enviar a branch gh-pages
        run: |
          mkdir -p public
          cp -r site/. public/
          [ -f apk/sakuga.apk ] && cp apk/sakuga.apk public/sakuga.apk || true
          touch public/.nojekyll
          cd public
          git init -q -b gh-pages
          git config user.name "Sakuga Bot"
          git config user.email "sakuga-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Site do Sakuga — build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Publicado em https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
